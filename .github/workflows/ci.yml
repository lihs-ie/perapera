name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_CACHE_FOLDER: .pnpm-store

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: ESLint
        run: pnpm lint
      - name: Prettier check
        run: pnpm fmt:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: WXT prepare (generates .wxt/types)
        run: pnpm --filter @perapera/extension exec wxt prepare
      - name: TypeScript
        run: pnpm typecheck

  test-extension:
    name: Test — Extension
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: WXT prepare
        run: pnpm --filter @perapera/extension exec wxt prepare
      - name: Vitest + coverage
        run: pnpm --filter @perapera/extension test:coverage
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-extension
          path: packages/extension/coverage
          retention-days: 7

  test-relay:
    name: Test — Relay API
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Vitest + coverage
        run: pnpm --filter @perapera/relay-api test:coverage
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-relay-api
          path: packages/relay-api/coverage
          retention-days: 7

  build-extension:
    name: Build — Extension
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: WXT build
        run: pnpm --filter @perapera/extension build
      - name: WXT zip
        run: pnpm --filter @perapera/extension zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: packages/extension/.output/chrome-mv3
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: packages/extension/.output/*.zip
          retention-days: 7

  build-relay:
    name: Build — Relay API
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: tsc build
        run: pnpm --filter @perapera/relay-api build
      - uses: actions/upload-artifact@v4
        with:
          name: relay-dist
          path: packages/relay-api/dist
          retention-days: 7

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: build-extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: packages/extension/.output/chrome-mv3
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        # actrun ローカル実行ではスキップ (ブラウザ DL が重く、xvfb も無い)
        if: ${{ !env.ACTRUN_LOCAL }}
        run: pnpm --filter @perapera/extension exec playwright install --with-deps chromium
      - name: Run E2E (headful via xvfb)
        # MV3 拡張は headful 必須で macOS には xvfb が無いため actrun ローカル実行では skip
        if: ${{ !env.ACTRUN_LOCAL }}
        run: xvfb-run -a pnpm --filter @perapera/extension e2e
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: playwright-report
          path: packages/extension/playwright-report
          retention-days: 7

  docker-relay:
    name: Docker — Relay API
    runs-on: ubuntu-latest
    needs: build-relay
    steps:
      # Sentinel: actrun ローカル実行で docker 系アクションが全て skip されても
      # 「job に step が 0 個」エラーを避けるために常時実行される 1 step を残す。
      - name: Job marker
        run: echo "docker-relay building perapera-relay-api image"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay-api/Dockerfile
          push: false
          tags: perapera-relay-api:ci
          cache-from: type=gha,scope=relay-api
          cache-to: type=gha,mode=max,scope=relay-api

  all-green:
    name: All Green
    # skipped な needs を success と同等に扱う (actrun で e2e/docker-relay が skip されてもゲートを通す)
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test-extension
      - test-relay
      - build-extension
      - build-relay
      - e2e
      - docker-relay
    steps:
      - run: echo "All required checks passed."
