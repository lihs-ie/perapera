name: Release (scaffold)

# このファイルはリリースパイプラインの雛形です。
# 現時点では拡張 zip と Relay API Docker build のみを扱い、
# Chrome Web Store アップロード / GAR push は後続イテレーションで追加します。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-extension-zip:
    name: Build extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @perapera/extension build
      - run: pnpm --filter @perapera/extension zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-release-zip
          path: packages/extension/.output/*.zip

  build-relay-image:
    name: Build Relay API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      # TODO(release): GAR 認証を追加する
      #   - uses: google-github-actions/auth@v2 with workload_identity_provider ...
      #   - uses: docker/login-action@v3 with registry ...
      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: packages/relay-api/Dockerfile
          push: false
          tags: perapera-relay-api:${{ github.ref_name }}
          cache-from: type=gha,scope=relay-api
          cache-to: type=gha,mode=max,scope=relay-api
