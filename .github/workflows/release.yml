name: Release (scaffold)

# このファイルはリリースパイプラインの雛形です。
# 現時点では拡張 zip と Relay API Docker build のみを扱い、
# Chrome Web Store アップロード / GAR push は後続イテレーションで追加します。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-extension-zip:
    name: Build extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @perapera/extension build
      - run: pnpm --filter @perapera/extension zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-release-zip
          path: packages/extension/.output/*.zip

  build-relay-image:
    name: Build Relay API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # TODO(release): GAR 認証を追加する
      #   - uses: google-github-actions/auth@v2 with workload_identity_provider ...
      #   - uses: docker/login-action@v3 with registry ...
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/relay-api/Dockerfile
          push: false
          tags: perapera-relay-api:${{ github.ref_name }}
          cache-from: type=gha,scope=relay-api
          cache-to: type=gha,mode=max,scope=relay-api
